<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Poketto — Know where your money goes</title>
    <meta
      name="description"
      content="Poketto is an offline expense tracker with analytics that make sense. Spending, what's left and your daily average, in one glance."

    <meta

    />
    <meta name="theme-color" content="#2051D9" />

    <link rel="icon" type="image/png" sizes="256x256" href="/img/icon.png" />
    <link rel="apple-touch-icon" href="/img/icon.png" />

    <!-- Open Graph / Social Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Poketto — Know where your money goes" />

      property="og:description"
      content="Poketto is an offline expense tracker with analytics that make sense. Spending, what's left and your daily average, in one glance."
    />
    <meta property="og:site_name" content="Poketto" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Poketto — Know where your money goes" />

      name="twitter:description"
      content="Poketto is an offline expense tracker with analytics that make sense. Spending, what's left and your daily average, in one glance."
    />
    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Poketto",
        "operatingSystem": "Android",
        "applicationCategory": "FinanceApplication",
        "description": "Offline expense tracker with analytics that make sense. Spending, what's left and your daily average, in one glance.",

          "@type": "Offer",
          "price": "0"
        },
        "installUrl": "https://play.google.com/store/apps/details?id=com.king_grey.pockit"

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,100..1000&display=swap"

    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
